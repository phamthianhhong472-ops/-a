name: Build KernelSU + SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo URL'
        required: true
        default: 'https://github.com/LineageOS/android_kernel_samsung_sm7125'
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: 'lineage-20'
      defconfig:
        description: 'Defconfig path'
        required: true
        default: 'arch/arm64/configs/vendor/atoll_server_defconfig'
      ksu_tag:
        description: 'KernelSU tag'
        required: true
        default: 'v0.9.5'
      susfs_branch:
        description: 'susfs4ksu branch'
        required: true
        default: 'kernel-4.14'

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            python2 python2-minimal python3 rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev patch cpio

      - name: Clone kernel source & Find Defconfig
        run: |
          set -e
          mkdir -p work
          cd work
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ github.event.inputs.kernel_repo }}" kernel
          cd kernel
          
          TARGET_DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ ! -f "$TARGET_DEFCONFIG" ]; then
            echo "Thử tìm file trong thư mục vendor..."
            TARGET_DEFCONFIG=$(find arch/arm64/configs -name "*atoll*" -o -name "*a52*" -o -name "*sm7125*" | head -n 1)
          fi
          
          if [ -z "$TARGET_DEFCONFIG" ] || [ ! -f "$TARGET_DEFCONFIG" ]; then
            echo "LỖI: Không tìm thấy file defconfig!"
            exit 1
          fi
          
          echo "DEFCONFIG_PATH=$TARGET_DEFCONFIG" >> $GITHUB_ENV
          echo "DEFCONFIG_NAME=$(basename "$TARGET_DEFCONFIG")" >> $GITHUB_ENV
          echo "Đã xác nhận file defconfig: $TARGET_DEFCONFIG"

      - name: Clone toolchains
        run: |
          set -e
          cd work
          mkdir -p toolchain && cd toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm
          git clone --depth=1 -b android-12.0.0_r3 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang

      - name: Integrate KernelSU ${{ github.event.inputs.ksu_tag }}
        run: |
          set -e
          cd work/kernel
          git clone --depth=1 --branch "${{ github.event.inputs.ksu_tag }}" https://github.com/tiann/KernelSU.git KernelSU
          find KernelSU -type f \( -name '*.c' -o -name '*.h' \) -print0 | xargs -0 sed -i 's/^#ifdef CONFIG_KPROBES$/#if defined(CONFIG_KPROBES) \&\& 0/'
          grep -q 'source "KernelSU/kernel/Kconfig"' Kconfig || echo 'source "KernelSU/kernel/Kconfig"' >> Kconfig
          grep -q 'KernelSU' Makefile || sed -i '0,/^obj-y/s//obj-$(CONFIG_KSU) += KernelSU\/\nobj-y/' Makefile

      - name: Integrate SUSFS
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          cd work/kernel
          
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu || {
            echo "LỖI: Không thể clone kho susfs4ksu."
            exit 1
          }
          
          SUSFS=../susfs4ksu
          
          KSU_PATCH=$(find $SUSFS -name '*enable_susfs_for_ksu*.patch' | head -1)
          if [ -n "$KSU_PATCH" ]; then
            cp "$KSU_PATCH" KernelSU/
            cd KernelSU && patch -p1 < $(basename "$KSU_PATCH") || true
            cd ..
          fi
          
          for SRCDIR in "$SUSFS/kernel_patches/fs" "$SUSFS/kernel_patches" "$SUSFS/fs"; do
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs.c' -exec cp -v {} fs/ \;
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs.h' -exec cp -v {} fs/ \;
          done
          for SRCDIR in "$SUSFS/kernel_patches/include/linux" "$SUSFS/kernel_patches/include" "$SUSFS/include/linux"; do
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs*' -exec cp -v {} include/linux/ \;
          done
          
          SUSFS_KERNEL_PATCH=$(find $SUSFS -name '*4.14*.patch' -o -name '*kernel-4.14*.patch' | head -1)
          if [ -n "$SUSFS_KERNEL_PATCH" ]; then
            echo "Tìm thấy patch kernel: $SUSFS_KERNEL_PATCH"
            cp "$SUSFS_KERNEL_PATCH" .
            patch -p1 --fuzz=3 < $(basename "$SUSFS_KERNEL_PATCH") || true
          fi

      - name: Apply manual KSU hooks via Python
        run: |
          cd work/kernel
          python3 -c '
          import os

          def patch_file(path, target, hook):
              if os.path.exists(path):
                  with open(path, "r") as f:
                      content = f.read()
                  if target in content and hook.strip() not in content:
                      content = content.replace(target, hook + "\n" + target)
                      with open(path, "w") as f:
                          f.write(content)

          patch_file("fs/exec.c", "static int do_execveat_common", "#ifdef CONFIG_KSU\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n")
          patch_file("fs/open.c", "long do_faccessat", "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n")
          patch_file("fs/read_write.c", "ssize_t vfs_read", "#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\n")
          '

      - name: Update defconfig
        run: |
          set -e
          cd work/kernel
          cat >> "$DEFCONFIG_PATH" <<'CFGEOF'

          CONFIG_KSU=y
          # CONFIG_KPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set
          # CONFIG_KSU_KPROBES_HOOK is not set
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAPS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CFGEOF

      - name: Build kernel
        run: |
          set -e
          cd work/kernel
          export ARCH=arm64 SUBARCH=arm64
          TC=../toolchain
          export PATH="$TC/clang/bin:$TC/gcc-arm64/bin:$TC/gcc-arm/bin:$PATH"
          export CROSS_COMPILE="$TC/gcc-arm64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$TC/gcc-arm/bin/arm-linux-androideabi-"
          export CC="$TC/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out ARCH=arm64 CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" "$DEFCONFIG_NAME"
          make -j$(nproc) O=out ARCH=arm64 CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" 2>&1 | tee build.log

      - name: Check build result
        if: always()
        run: |
          cd work/kernel
          tail -30 build.log || true
          if [ -f out/arch/arm64/boot/Image ] || [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "BUILD THÀNH CÔNG"
          else
            echo "BUILD THẤT BẠI"
            exit 1
          fi

      - name: Package AnyKernel3
        if: success()
        run: |
          cd work
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -rf .git README.md
          cat > anykernel.sh <<'AKEOF'
          properties() { '
          kernel.string=A52q KernelSU+SUSFS
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          device.name1=a52q
          device.name2=SM-A525F
          device.name3=SM-A525M
          device.name4=a52qxx
          '; }
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          AKEOF
          cd ../kernel
          cp out/arch/arm64/boot/Image.gz ../AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image ../AnyKernel3/
          cd ../AnyKernel3
          zip -r9 "../A52q-KernelSU-SUSFS.zip" . -x '.git'

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A52q-KernelSU-SUSFS
          path: work/A52q-KernelSU-SUSFS.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: work/kernel/build.log
          retention-days: 14
