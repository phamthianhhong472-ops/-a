- name: Integrate SUSFS
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          cd work/kernel
          
          # Clone kho susfs4ksu không chỉ định nhánh để tránh lỗi 404/auth
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu || {
            echo "LỖI: Không thể clone kho susfs4ksu."
            exit 1
          }
          
          SUSFS=../susfs4ksu
          
          # Tự động tìm và áp dụng patch KernelSU
          KSU_PATCH=$(find $SUSFS -name '*enable_susfs_for_ksu*.patch' | head -1)
          if [ -n "$KSU_PATCH" ]; then
            cp "$KSU_PATCH" KernelSU/
            cd KernelSU && patch -p1 < $(basename "$KSU_PATCH") || true
            cd ..
          fi
          
          # Chép các file nguồn susfs vào kernel
          for SRCDIR in "$SUSFS/kernel_patches/fs" "$SUSFS/kernel_patches" "$SUSFS/fs"; do
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs.c' -exec cp -v {} fs/ \;
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs.h' -exec cp -v {} fs/ \;
          done
          for SRCDIR in "$SUSFS/kernel_patches/include/linux" "$SUSFS/kernel_patches/include" "$SUSFS/include/linux"; do
            [ -d "$SRCDIR" ] && find "$SRCDIR" -maxdepth 1 -name 'susfs*' -exec cp -v {} include/linux/ \;
          done
          
          # Tìm patch susfs dành cho Kernel 4.14
          SUSFS_KERNEL_PATCH=$(find $SUSFS -name '*4.14*.patch' -o -name '*kernel-4.14*.patch' | head -1)
          if [ -n "$SUSFS_KERNEL_PATCH" ]; then
            echo "Tìm thấy patch kernel: $SUSFS_KERNEL_PATCH"
            cp "$SUSFS_KERNEL_PATCH" .
            patch -p1 --fuzz=3 < $(basename "$SUSFS_KERNEL_PATCH") || true
          fi
